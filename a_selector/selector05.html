<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자식 자손 선택자</title>
    <style>
        /* div가 여러개인 경우 클래스로 호출 */
        .container a {
            color: purple;
        }

        .container p > span {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">div태그
        <p>p태그
            <a href="#">a태그</a> 
            <span>span태그</span>
        </p>
        <span>span태그</span>
    </div>
</body>
</html>
